<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shop — Me Next Level</title>
<link rel="stylesheet" href="../public/shop.css">
<link rel="icon" href="../public/favicon.svg" type="image/svg+xml">
</head>
<body>

<header class="shop-header">
  <a href="../" class="shop-logo" aria-label="Me Next Level">
    <canvas id="ledLogo" width="148" height="36" role="img" aria-label="Me Next Level"></canvas>
  </a>
  <a href="../" class="shop-back">← Back to Game</a>
</header>

<section class="shop-hero">
  <h1>SHOP</h1>
  <p class="shop-hero-sub">Build your next level — starting with the right kit.</p>
</section>

<main class="shop-grid-wrap">
  <div id="shopGrid" class="shop-grid">
    <div class="shop-loading">LOADING…</div>
  </div>
</main>

<!-- Product detail modal -->
<div id="shopModal" class="shop-modal" role="dialog" aria-modal="true" aria-label="Product detail">
  <div class="shop-modal-inner">
    <button class="shop-modal-close" id="shopModalClose" aria-label="Close">✕</button>
    <div class="shop-modal-layout">

      <div class="shop-modal-img-wrap" id="shopModalImgWrap">
        <img id="shopModalImg" class="shop-modal-img" src="" alt="" loading="lazy">
        <div id="shopModalImgPh" class="shop-modal-img-placeholder" style="display:none">ME NEXT LEVEL</div>
      </div>

      <div class="shop-modal-details">
        <h2 class="shop-modal-name" id="shopModalName"></h2>
        <div class="shop-modal-price" id="shopModalPrice"></div>
        <p class="shop-modal-desc" id="shopModalDesc"></p>
        <div id="shopModalIncluded" class="shop-modal-included" style="display:none"></div>
        <div class="shop-modal-actions">
          <div class="shop-qty">
            <button class="shop-qty-btn" id="shopQtyDown" aria-label="Decrease quantity">−</button>
            <span class="shop-qty-num" id="shopQtyNum" aria-live="polite">1</span>
            <button class="shop-qty-btn" id="shopQtyUp" aria-label="Increase quantity">+</button>
          </div>
          <button class="shop-order-btn" id="shopOrderBtn">ORDER NOW</button>
        </div>
        <p class="shop-modal-note">Ships Australia &amp; worldwide · Secure checkout</p>
      </div>

    </div>
  </div>
</div>

<footer class="shop-footer">
  <span>© Me Next Level. All rights reserved.</span>
  <a href="../">← Back to Game</a>
</footer>

<script type="module" src="../public/led-logo.js?v=16"></script>
<script>
  window.addEventListener("load",function(){
    var c=document.getElementById("ledLogo");
    if(c&&window.LEDLogo)window.LEDLogo.init(c);
  });
</script>
<script type="module" src="../public/shop.js"></script>
</body>
</html>
