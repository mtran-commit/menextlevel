<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Me Next Level — Super Admin</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:13px}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid #333}
header h1{font-size:18px;font-style:italic;margin:0}
header a{color:#bbb;font-size:11px;text-decoration:none;border:1px solid #555;border-radius:999px;padding:5px 12px}
nav{display:flex;gap:6px;flex-wrap:wrap;padding:10px 18px;border-bottom:1px solid #222}
nav button{background:#000;color:#fff;border:1px solid #555;border-radius:999px;padding:6px 14px;font-size:11px;letter-spacing:1px;cursor:pointer}
nav button.active{background:#fff;color:#000;font-weight:700}
main{padding:16px 18px;max-width:1100px;margin:0 auto}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{border-bottom:1px solid #222;text-align:left;padding:7px 8px;vertical-align:top}
th{color:#999;font-weight:600;font-size:10px;letter-spacing:1px;text-transform:uppercase}
.btn{background:#000;color:#fff;border:1px solid #fff;border-radius:999px;padding:4px 10px;font-size:10px;cursor:pointer}
.btn.solid{background:#fff;color:#000;font-weight:700}
input,textarea,select{background:#000;color:#fff;border:1px solid #555;border-radius:8px;padding:7px 9px;font-size:12px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:18px}
.card{border:1px solid #333;border-radius:12px;padding:12px}
.card b{display:block;font-size:22px}
.card span{font-size:10px;color:#999;letter-spacing:1px}
.muted{color:#888;font-size:11px}
.pill{border:1px solid #555;border-radius:999px;padding:2px 8px;font-size:10px}
.row{display:flex;gap:8px;align-items:center;margin:10px 0;flex-wrap:wrap}
#gate{display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:center;min-height:70vh;text-align:center;padding:20px}
h2{font-size:14px;letter-spacing:2px}
</style>
</head>
<body>
<header><h1>Me Next Level — Super Admin</h1><a href="./">← BACK TO GAME</a></header>
<div id="gate"><p class="muted">Checking access…</p></div>
<nav id="nav" style="display:none">
  <button data-tab="stats" class="active">STATS</button>
  <button data-tab="users">USERS</button>
  <button data-tab="reports">REPORTS</button>
  <button data-tab="announcements">ANNOUNCEMENTS</button>
  <button data-tab="sponsors">SPONSOR CAMPAIGNS</button>
  <button data-tab="rules">ACHIEVEMENT RULES</button>
  <button data-tab="logs">ERRORS &amp; AUDIT LOGS</button>
</nav>
<main id="main" style="display:none"></main>
<script type="module" src="./src/admin.ts"></script>
</body>
</html>
