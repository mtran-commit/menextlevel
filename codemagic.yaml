workflows:
  ios-capacitor:
    name: Me Next Level iOS
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      node: "24"
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "com.menextlevel.app"
        APP_STORE_APPLE_ID: "6800945735"
        APP_STORE_ISSUER_ID: "fedfbbf9-9319-4e24-8331-da672f91233c"
        APP_STORE_KEY_ID: "6GAKLT9Y8B"
        VITE_PROD_API_ORIGIN: "https://asset-manager-chefonvespa.replit.app"
      groups:
        - menextlevel
    integrations:
      app_store_connect: menextlevel_app_store

    scripts:
      # ── Tooling ───────────────────────────────────────────────────────────────
      - name: Install pnpm
        script: npm install -g pnpm --force

      # ── Fix Replit-specific lockfile (CI machine only) ────────────────────────
      # Replit resolves packages through an internal proxy unreachable on Codemagic.
      - name: Rewrite lockfile registry
        script: |
          perl -i -pe \
            's|https://[^/]*\.replit\.dev/[^/]*/|https://registry.npmjs.org/|g' \
            pnpm-lock.yaml

      # Strip Linux-only native binary exclusions so macOS gets the right binaries.
      # Also remove onlyBuiltDependencies — a Replit/Linux security measure that
      # blocks build scripts on macOS. Codemagic runs in an isolated VM; it's safe.
      - name: Strip Linux-only platform overrides
        script: |
          perl -i -pe 's/: "-"$/: "*"/g' pnpm-workspace.yaml
          python3 -c "
          import re
          content = open('pnpm-workspace.yaml').read()
          content = re.sub(r'\nonlyBuiltDependencies:(\n  - .+)+', '', content)
          open('pnpm-workspace.yaml', 'w').write(content)
          "

      # ── Install ───────────────────────────────────────────────────────────────
      - name: Install dependencies
        script: pnpm install --no-frozen-lockfile

      # ── Build ─────────────────────────────────────────────────────────────────
      - name: Build workspace libs
        script: pnpm run typecheck:libs

      - name: Vite build
        working_directory: artifacts/menotme
        script: BASE_PATH=./ PORT=3000 pnpm run build

      # ── Capacitor native project ──────────────────────────────────────────────
      - name: Add iOS platform
        working_directory: artifacts/menotme
        script: |
          set -e
          if [ ! -d "ios/App" ]; then
            npx cap add ios --packagemanager CocoaPods
          fi

      - name: Generate icons and splash
        working_directory: artifacts/menotme
        script: npx @capacitor/assets generate || true

      - name: Sync web build into iOS
        working_directory: artifacts/menotme
        script: npx cap sync ios

      - name: Install CocoaPods
        working_directory: artifacts/menotme/ios/App
        script: |
          set -e
          pod install --repo-update
          test -d App.xcworkspace

      # ── Code signing ──────────────────────────────────────────────────────────
      - name: Create signing certificate and provisioning profile
        script: |
          set -e
          keychain initialize

          # Apple caps distribution certificates. Delete existing ones so there
          # is always room to mint a fresh one. Safe: Apple re-signs on distribution.
          echo "=== Listing existing certificates ==="
          app-store-connect certificates list --json > /tmp/certs.json 2>/tmp/certs.err \
            || { echo "certificates list failed:"; cat /tmp/certs.err; echo "[]" > /tmp/certs.json; }
          CERT_IDS=$(python3 -c "import json; print(' '.join(c.get('id','') for c in json.load(open('/tmp/certs.json'))))" || true)
          echo "Certificate IDs to delete: [$CERT_IDS]"
          for CID in $CERT_IDS; do
            app-store-connect certificates delete "$CID" </dev/null \
              || echo "WARN: could not delete $CID"
          done

          # Generate a fresh private key for the new certificate.
          # --certificate-key is required for --create to actually mint a cert.
          openssl genrsa -out /tmp/ios_cert_key.pem 2048
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key @file:/tmp/ios_cert_key.pem \
            --create

          keychain add-certificates

      - name: Apply provisioning profiles
        script: xcode-project use-profiles

      # ── Build IPA ─────────────────────────────────────────────────────────────
      - name: Increment build number
        script: |
          cd artifacts/menotme/ios/App
          agvtool new-version -all $(($BUILD_NUMBER))

      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --workspace "artifacts/menotme/ios/App/App.xcworkspace" \
            --scheme "App"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Logs/gym/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
