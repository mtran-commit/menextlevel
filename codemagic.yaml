workflows:
  ios-capacitor:
    name: Me Next Level iOS
    max_build_duration: 60
    instance_type: mac_mini_m1

    integrations:
      app_store_connect: menextlevel_app_store

    environment:
      node: "24"

      # Secrets group — create in Codemagic: Team Settings → Global variables
      # and secrets → Create group → "menextlevel_secrets". Add these variables:
      #   VITE_CLERK_PUBLISHABLE_KEY — your Clerk pk_test_… or pk_live_… key (Secure)
      #   APP_STORE_PRIVATE_KEY      — full contents of the .p8 file (Secure)
      groups:
        - menextlevel

      vars:
        APP_STORE_APPLE_ID: "6800945735"
        APP_STORE_ISSUER_ID: "fedfbbf9-9319-4e24-8331-da672f91233c"
        APP_STORE_KEY_ID: "6GAKLT9Y8B"
        VITE_PROD_API_ORIGIN: "https://asset-manager-chefonvespa.replit.app"

    scripts:
      # ── Tooling ──────────────────────────────────────────────────────────────
      - name: Install pnpm
        script: npm install -g pnpm --force

      # ── Fix Replit-specific pnpm config (CI machine only) ────────────────────
      # Replit resolves packages through an internal proxy unreachable on
      # Codemagic. Rewrite to the public npm registry (CI-local only).
      - name: Rewrite lockfile registry
        script: |
          perl -i -pe \
            's|https://[^/]*\.replit\.dev/[^/]*/|https://registry.npmjs.org/|g' \
            pnpm-lock.yaml

      # pnpm-workspace.yaml excludes non-Linux native binaries.
      # The Mac build needs darwin variants; strip the exclusions (CI-local only).
      - name: Strip Linux-only platform overrides
        script: |
          perl -i -pe 's/: "-"$/: "*"/g' pnpm-workspace.yaml

      # ── Install ───────────────────────────────────────────────────────────────
      - name: Install dependencies
        script: pnpm install --no-frozen-lockfile

      # ── Build ─────────────────────────────────────────────────────────────────
      # Build shared workspace libs first — TypeScript project references fail
      # if lib outputs are missing.
      - name: Build workspace libs
        script: pnpm run typecheck:libs

      # BASE_PATH=./  → relative asset paths for capacitor://localhost
      # PORT=3000     → satisfies the vite.config.ts PORT guard
      - name: Vite build
        working_directory: artifacts/menotme
        script: BASE_PATH=./ PORT=3000 pnpm run build

      # ── Capacitor native project ──────────────────────────────────────────────
      - name: Add iOS platform
        working_directory: artifacts/menotme
        script: npx cap add ios

      - name: Capacitor copy
        working_directory: artifacts/menotme
        script: npx cap copy ios

      - name: Generate icons and splash
        working_directory: artifacts/menotme
        script: npx @capacitor/assets generate

      # ── Code signing ──────────────────────────────────────────────────────────
      - name: Initialize keychain
        script: keychain initialize

      # Fetch (or create) the App Store certificate and provisioning profile.
      # Credentials are passed explicitly so the CLI doesn't rely on the
      # integration auto-injection, which conflicts with ios_signing auto-mode.
      - name: Fetch signing files
        script: |
          app-store-connect fetch-signing-files com.menextlevel.app \
            --type IOS_APP_STORE \
            --create \
            --issuer-id "$APP_STORE_ISSUER_ID" \
            --key-id "$APP_STORE_KEY_ID" \
            --private-key "@env:APP_STORE_PRIVATE_KEY"

      - name: Add certificates to keychain
        script: keychain add-certificates

      - name: Apply provisioning profiles
        script: xcode-project use-profiles

      # ── Build IPA ─────────────────────────────────────────────────────────────
      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --workspace artifacts/menotme/ios/App/App.xcworkspace \
            --scheme App

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Logs/gym/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
